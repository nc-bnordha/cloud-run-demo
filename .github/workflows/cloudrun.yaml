name: Deploy sample to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: grand-incentive-507903-f0
          workload_identity_provider: projects/453285865082/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@grand-incentive-507903-f0.iam.gserviceaccount.com

      - name: Deploy sample container
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: grand-incentive-507903-f0
          region: asia-southeast1
          service: wif-sample
          image: us-docker.pkg.dev/cloudrun/container/hello:latest
          flags: >-
            --service-account=cloud-run-runtime@grand-incentive-507903-f0.iam.gserviceaccount.com
            --allow-unauthenticated

      - name: Show service URL
        run: |
          echo "Service URL: ${{ steps.deploy.outputs.url }}"
          curl --fail "${{ steps.deploy.outputs.url }}"

# Trusted repository: nc-bnordha/cloud-run-demo
