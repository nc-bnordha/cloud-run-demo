name: Verify Google Cloud authentication

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  verify-authentication:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: grand-incentive-507903-f0
          workload_identity_provider: projects/453285865082/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@grand-incentive-507903-f0.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify identity and target project
        run: |
          gcloud auth list --filter=status:ACTIVE
          gcloud projects describe grand-incentive-507903-f0 --format='value(projectId)'
