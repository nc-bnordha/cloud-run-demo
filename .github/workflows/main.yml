name: Verify Google Cloud authentication

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  verify-authentication:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: nc-foobar-01
          workload_identity_provider: projects/790733925479/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@nc-foobar-01.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify identity and target project
        run: |
          gcloud auth list --filter=status:ACTIVE
          gcloud projects describe nc-foobar-01 --format='value(projectId)'

# Trusted repository: nc-bnordha/cloud-run-demo
